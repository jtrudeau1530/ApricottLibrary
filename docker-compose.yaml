services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: apricot-library-jellyfin
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      TZ: ${TZ:-America/New_York}
      JELLYFIN_PublishedServerUrl: ${JELLYFIN_URL:-http://localhost:8096}
    volumes:
      - jellyfin-config:/config
      - jellyfin-cache:/cache
      - ${MEDIA_PATH:-./media}:/media
    ports:
      - "8096:8096"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8096/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  slskd:
    image: slskd/slskd:latest
    container_name: apricot-library-slskd
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      TZ: ${TZ:-America/New_York}
      SLSKD_USERNAME: ${SLSKD_USERNAME:-admin}
      SLSKD_PASSWORD: ${SLSKD_PASSWORD}
      SLSKD_SLSK_USERNAME: ${SOULSEEK_USERNAME}
      SLSKD_SLSK_PASSWORD: ${SOULSEEK_PASSWORD}
      SLSKD_REMOTE_CONFIGURATION: "true"
      SLSKD_DOWNLOADS_DIR: /downloads/complete
      SLSKD_INCOMPLETE_DIR: /downloads/incomplete
    volumes:
      - slskd-config:/app
      - ${DOWNLOADS_PATH:-./downloads}:/downloads
    ports:
      - "5030:5030"
      - "50300:50300"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5030/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:16
    networks:
      default:
        aliases: [apricott-library-db]
    container_name: apricot-library-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-apricot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apricot-dev-only-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-apricot}
      TZ: ${TZ:-America/New_York}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-apricot} -d ${POSTGRES_DB:-apricot}"]
      interval: 10s
      timeout: 5s
      retries: 5

  bgutil-pot:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    container_name: apricot-library-bgutil-pot
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/New_York}
    expose:
      - "4416"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:4416/ping',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1));setTimeout(()=>process.exit(1),4000)"]
      interval: 30s
      timeout: 5s
      retries: 3

  sidecar:
    build: ./sidecar
    networks:
      default:
        aliases: [apricott-library-api]
    container_name: apricot-library-sidecar
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/New_York}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET}
      SPOTIFY_REDIRECT_URI: ${SPOTIFY_REDIRECT_URI:-https://library.zektek.us/api/auth/spotify/callback}
      DATA_PATH: /data
      MEDIA_PATH: /media
      DOWNLOADS_PATH: /downloads
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://apricot:apricot-dev-only-change-me@postgres:5432/apricot}
      APRICOT_ADMIN_USERNAME: ${APRICOT_ADMIN_USERNAME:-admin}
      APRICOT_ADMIN_PASSWORD: ${APRICOT_ADMIN_PASSWORD:-change-me-on-first-boot}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-apricot_session}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      JELLYFIN_INTERNAL_URL: ${JELLYFIN_INTERNAL_URL:-http://jellyfin:8096}
      JELLYFIN_API_KEY: ${JELLYFIN_API_KEY:-REPLACE_WITH_JELLYFIN_API_KEY}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-https://library.zektek.us}
      BGUTIL_POT_URL: http://bgutil-pot:4416
      LIBRARY_CATALOG_TOKEN: ${LIBRARY_CATALOG_TOKEN:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_MAX_COMPLETION_TOKENS: ${AI_MAX_COMPLETION_TOKENS:-2048}
      AI_MAX_CALLS_PER_JOB: ${AI_MAX_CALLS_PER_JOB:-3}
      AI_BATCH_SIZE: ${AI_BATCH_SIZE:-20}
      SLSKD_INTERNAL_URL: ${SLSKD_INTERNAL_URL:-http://slskd:5030}
      SLSKD_USERNAME: ${SLSKD_USERNAME:-admin}
      SLSKD_PASSWORD: ${SLSKD_PASSWORD:-}
      SLSKD_API_KEY: ${SLSKD_API_KEY:-}
      SLSKD_COMPLETE_PATH: /downloads/complete
      DISCOVERY_MIN_INTERVAL_HOURS: ${DISCOVERY_MIN_INTERVAL_HOURS:-24}
      DISCOVERY_MAX_SCHEDULE_RUNS: ${DISCOVERY_MAX_SCHEDULE_RUNS:-30}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-90}
      ACQUISITION_CONCURRENCY: ${ACQUISITION_CONCURRENCY:-2}
      ACQUISITION_MAX_ATTEMPTS: ${ACQUISITION_MAX_ATTEMPTS:-3}
      ACQUISITION_TIMEOUT_SECONDS: ${ACQUISITION_TIMEOUT_SECONDS:-300}
      STATION_IMPORT_ATTEMPTS: ${STATION_IMPORT_ATTEMPTS:-20}
    volumes:
      - sidecar-data:/data
      - ${MEDIA_PATH:-./media}:/media
      - ${DOWNLOADS_PATH:-./downloads}:/downloads
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      slskd:
        condition: service_started
      bgutil-pot:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build: ./frontend
    container_name: apricot-library-frontend
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/New_York}
      NODE_ENV: production
      PORT: "3000"
      ORIGIN: ${PUBLIC_APP_URL:-https://library.zektek.us}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-https://library.zektek.us}
      SIDECAR_INTERNAL_URL: http://sidecar:8000
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-REPLACE_WITH_OPENSSL_RAND_HEX_32}
      DATABASE_URL: ${DATABASE_URL:-postgresql://apricot:apricot-dev-only-change-me@postgres:5432/apricot}
    expose:
      - "3000"
    depends_on:
      sidecar:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  jellyfin-config:
  jellyfin-cache:
  slskd-config:
  sidecar-data:
  postgres-data:
